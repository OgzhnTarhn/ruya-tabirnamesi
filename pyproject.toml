[project]
name = "ruya"
version = "0.0.1"
description = "Çok kaynaklı Türkçe rüya tabiri RAG'ı (kişisel öğrenme projesi)"
readme = "README.md"
requires-python = ">=3.11"
# Sürümler alt sınırla yazılır: Colab'in hazır kurulu paketleriyle çakışmasın (TK-02).
dependencies = [
    "anthropic>=2.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "zeyrek>=0.1.3",
]

[project.optional-dependencies]
# Ağır paketler yalnızca Colab'de kurulur: pip install -e ".[colab]"
indeks = [
    "chromadb>=1.0",
    "sentence-transformers>=5.0",
]
arayuz = [
    "gradio>=5.0",
]
colab = [
    "ruya[indeks,arayuz]",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15",
    "nbstripout>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ruya"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "veri: Drive'daki veriyi gerektirir; yalnızca Colab'de çalışır",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# RUF001-003: Türkçe metindeki ı, İ gibi harfleri "karıştırılabilir karakter" sayıyor.
ignore = ["RUF001", "RUF002", "RUF003"]
